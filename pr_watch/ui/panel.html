<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Watch</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="icons.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="hd">
        <h1 id="title">PR Watch</h1>
        <div class="actions">
          <button id="btn-refresh" title="Actualizar ahora, sin esperar al próximo sondeo">
            <i class="ic"><span class="g">&#xE72C;</span>
              <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" /><path d="M12.5 1.5v3h-3" /></svg></i>
          </button>
          <button id="btn-settings" title="Configurar organización y token">
            <i class="ic"><span class="g">&#xE713;</span>
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg></i>
          </button>
          <button id="btn-pin" title="Fijar para que no se oculte">
            <i class="ic"><span class="g">&#xE718;</span>
              <svg viewBox="0 0 16 16"><path d="M9.5 1.5l5 5-2 .5-2.5 2.5.5 3-1.5 1.5-3-3-4 4M6 7.5l2.5-2.5.5-2z" /></svg></i>
          </button>
          <button id="btn-close" title="Ocultar">
            <i class="ic"><span class="g">&#xE711;</span>
              <svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg></i>
          </button>
        </div>
      </div>

      <div class="sec"><span>CUENTA</span></div>
      <div id="account"></div>
      <div id="notice"></div>

      <div id="blocks"></div>

      <hr />
      <div class="ft"><span id="updated"></span><span id="version"></span></div>
    </div>
    <script src="common.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
