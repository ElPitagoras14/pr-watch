name: release

# Publicar una version es subir a main un commit que la sube: check-version mira
# si ya existe el tag y, si existe, el pipeline se acaba ahi.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Dos pushes seguidos no pueden competir por el mismo tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: check-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.decidir.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # Sin uv ni dependencias: el script es solo biblioteca estandar, asi que
      # este job dura segundos aunque el resto del pipeline no llegue a correr.
      - name: Leer la version del proyecto
        id: version
        run: python3 scripts/release_version.py

      - name: Decidir si hay algo que publicar
        id: decidir
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $VERSION ya esta publicada: nada que hacer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publicando la version $VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: verify
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    # En Windows porque es donde pyright --strict resuelve winreg, que en
    # autostart.py y theme.py se importa sin type: ignore. Las pruebas corren
    # ademas en Linux, dentro de build-linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Version exacta: setup-uv no publica un tag mayor movil como actions/*.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv run ruff check
      - run: uv run pyright

  build-windows:
    name: build (windows)
    needs: [check-version, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Version exacta: setup-uv no publica un tag mayor movil como actions/*.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Construir el ejecutable
        run: uv run build.py

      - name: Comprobar que existe y ponerle la version al nombre
        shell: pwsh
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if (-not (Test-Path dist/pr-watch.exe)) { throw "no se genero dist/pr-watch.exe" }
          Move-Item dist/pr-watch.exe "dist/pr-watch-$env:VERSION-windows.exe"
          Get-Item "dist/pr-watch-$env:VERSION-windows.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: pr-watch-windows
          path: dist/pr-watch-${{ needs.check-version.outputs.version }}-windows.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build (linux)
    needs: [check-version, verify]
    runs-on: ubuntu-24.04
    # La glibc del binario la fija esta imagen, no el runner: el binario corre en
    # cualquier sistema con una glibc igual o mas nueva que la de aqui, asi que este
    # es el piso. Debe coincidir con MIN_GLIBC de pr_watch/platform_check.py, y
    # smoke-linux lo comprueba. Una imagen y no `runs-on: ubuntu-22.04`, porque ese
    # runner se retira antes que la imagen.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Antes del checkout: sin git la accion baja un tarball en vez de clonar.
      # pygobject (serie 3.50, girepository-1.0) y pycairo estan en el bloqueo como
      # sdist: hay que compilarlos. Los paquetes gir1.2-* son los mismos que el
      # README pide al usuario final.
      - name: Dependencias del sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gir1.2-ayatanaappindicator3-0.1 \
            xauth \
            xvfb

      - uses: actions/checkout@v7

      # Version exacta: setup-uv no publica un tag mayor movil como actions/*.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked

      # La cobertura de Linux que verify no puede dar: el entorno ya esta aqui.
      # Bajo xvfb porque pystray elige el backend X11 al importarse y sin
      # DISPLAY falla al cargar. La construccion no lo necesita: PyInstaller
      # analiza los modulos sin levantar la bandeja.
      - run: xvfb-run -a uv run python -m unittest discover -s tests

      - name: Construir el ejecutable
        run: uv run build.py

      - name: Comprobar que existe y ponerle la version al nombre
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          test -x dist/pr-watch || { echo "no se genero dist/pr-watch"; exit 1; }
          mv dist/pr-watch "dist/pr-watch-$VERSION-linux"
          ls -la "dist/pr-watch-$VERSION-linux"

      - uses: actions/upload-artifact@v7
        with:
          name: pr-watch-linux
          path: dist/pr-watch-${{ needs.check-version.outputs.version }}-linux
          if-no-files-found: error
          retention-days: 7

  # Ejecuta el binario recien construido en distribuciones limpias, solo con los
  # paquetes de ejecucion que pide el README: sin las cabeceras -dev que si hay en
  # build-linux. Si no arranca en el piso de glibc o en la mas reciente, no hay tag.
  smoke-linux:
    name: smoke (${{ matrix.image }})
    needs: [check-version, build-linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 22.04: el piso de glibc. 12: la distribucion con la que fallo la 0.1.4.
        # 13: la mas reciente con glib >= 2.80, donde no existe girepository-1.0.
        image: ["ubuntu:22.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Dependencias de ejecucion
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gir1.2-ayatanaappindicator3-0.1 \
            xauth \
            xvfb

      - uses: actions/download-artifact@v8
        with:
          name: pr-watch-linux
          path: artefactos

      # --check-system sale con 0 si las bibliotecas estan completas, o con 1 y un
      # mensaje que dice que falta. No abre la bandeja ni toma la instancia unica.
      - name: Arrancar el binario
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          ldd --version | head -1
          chmod +x "artefactos/pr-watch-$VERSION-linux"
          xvfb-run -a "artefactos/pr-watch-$VERSION-linux" --check-system

  tag:
    name: tag
    needs: [check-version, build-windows, build-linux, smoke-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Sin --force: si otra ejecucion ya creo el tag, esto falla y no se
      # publica encima de lo que ya existe.
      - name: Crear y empujar el tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "pr-watch v$VERSION"
          git push origin "refs/tags/v$VERSION"

  release:
    name: release
    needs: [check-version, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artefactos
          merge-multiple: true

      - name: Armar las notas
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git fetch --tags --force --quiet
          anterior=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          if [ -n "$anterior" ]; then
            rango="$anterior..v$VERSION"
            echo "Cambios desde $anterior:" > notas.md
          else
            rango="v$VERSION"
            echo "Primera version publicada." > notas.md
          fi
          echo >> notas.md
          git log --no-merges --pretty=format:'- %s (%h)' "$rango" >> notas.md
          cat >> notas.md <<'FIN'


          ---

          **Windows**: descarga `pr-watch-<version>-windows.exe` y ejecutalo. Es portable: no hay instalador ni hace falta Python.

          **Linux**: descarga `pr-watch-<version>-linux`, dale permiso de ejecucion (`chmod +x pr-watch-<version>-linux`) y ejecutalo. Se construye en Ubuntu 22.04 y lleva dentro Python y sus dependencias, asi que del sistema necesita glibc 2.35 o mas nueva (Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Fedora 36+), mas GTK, WebKit y el indicador de bandeja:

          ```
          sudo apt install gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1
          ```

          Para comprobar que tu sistema tiene todo sin abrir la aplicacion: `./pr-watch-<version>-linux --check-system`. Si algo falta, dice que.
          FIN
          cat notas.md

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          chmod +x "artefactos/pr-watch-$VERSION-linux"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notas.md \
            "artefactos/pr-watch-$VERSION-windows.exe" \
            "artefactos/pr-watch-$VERSION-linux"
